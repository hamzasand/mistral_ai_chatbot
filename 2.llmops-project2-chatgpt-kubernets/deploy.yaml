apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatgpt-deploy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: chatgpt-pod

  template:
    metadata:
      labels:
        app: chatgpt-pod

    spec:
      containers:
        - name: mychatgptcontainer

          image: hamzasand/chatgpt-project1:latest
          imagePullPolicy: IfNotPresent

          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"

          ports:
            - containerPort: 80

          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: API_KEY

---

apiVersion: v1
kind: Service
metadata:
  name: mysvc-v2

spec:
  type: NodePort

  selector:
    app: chatgpt-pod

  ports:
    - port: 5000
      targetPort: 80
      nodePort: 30002
      protocol: TCP