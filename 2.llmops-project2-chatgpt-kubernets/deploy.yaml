apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mistral-pod
  template:
    metadata:
      labels:
        app: mistral-pod
    spec:
      containers:
      - name: mymistralcontainer
        image: hamzasand/mistral-project
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8000
        env:
        - name: MISTRAL_API
          valueFrom:
            secretKeyRef:
              name: mistral-secret
              key: API_KEY


---
apiVersion: v1
kind: Service
metadata:
  name: mysvc-v2
spec:
  type: NodePort
  selector:
    app: chatgpt-pod
  ports:
  - port: 5000 # Service IP Port
    targetPort: 8000 # Container Port
    nodePort: 30002 # Node Port/Host Port
    protocol: TCP